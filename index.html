  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

padding:4px 8px;background:#17150f;color:oklch(0.78 0.16 350);font:700 10px/1 'Courier Prime',monospace;letter-spacing:.14em;text-transform:uppercase\">■ Investigación especial<\u002Fspan>\n  <h1 style=\"margin:0;font:900 40px/.95 'Playfair Display',serif;letter-spacing:-.01em;text-wrap:balance\">La noche en que el administrador desapareció<\u002Fh1>\n  <p style=\"margin:0;font:italic 400 16px/1.35 'Playfair Display',serif;color:#3a362d;text-wrap:pretty\">Una aplicación de Banco Meridiano empezó a comportarse de forma sospechosa. Nadie sabe por qué.<\u002Fp>\n  <span style=\"font:400 11px/1 'Courier Prime',monospace;letter-spacing:.06em;text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid #17150f\">Por la redacción · Baker St.<\u002Fspan>\n  <figure style=\"margin:0;display:flex;flex-direction:column;gap:5px\">\n    <div style=\"position:relative;height:210px;border:1px solid #17150f;overflow:hidden;background-color:#d8d0bd;background-image:radial-gradient(#17150f 1.1px,transparent 1.5px);background-size:6px 6px;display:flex;align-items:flex-end;padding:8px\">\n      {{ lensCrime }}<image-slot id=\"gz-crime-v4\" src=\"537482f9-44d3-4eca-b57a-a1703559b401\" shape=\"rect\" placeholder=\"Foto: carro con la puerta abierta y marcas de zapatos arrastrados\" style=\"position:absolute;inset:0;filter:grayscale(1) contrast(1.15)\"><\u002Fimage-slot>\n      {{ scan }}\n    <\u002Fdiv>\n    <figcaption style=\"font:italic 400 12px/1.3 'Playfair Display',serif;color:#4a453a\">Fig. 2 — Estacionamiento del banco: la puerta abierta y el rastro de unos zapatos arrastrados.<\u002Ffigcaption>\n  <\u002Ffigure>\n  <p style=\"margin:0;font:400 15px/1.45 'Courier Prime',monospace;text-wrap:pretty\"><span style=\"float:left;font:900 46px/.8 'Playfair Display',serif;margin:4px 6px 0 0\">E<\u002Fspan>n algún momento de enero de este año, una aplicación empezó a actuar de forma extraña. Nada estaba caído; algo, simplemente, no encajaba.<\u002Fp>\n  <p style=\"margin:0;font:400 15px/1.45 'Courier Prime',monospace;text-wrap:pretty\">El administrador microsegmentaba en tiempo récord, apoyado en IA para crear todas las reglas. Una noche, no llegó a casa.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px\">\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:4px\">\n      <div style=\"position:relative;height:120px;border:1px solid #17150f;background-color:#d8d0bd;background-image:radial-gradient(#17150f 1px,transparent 1.4px);background-size:5px 5px\">{{ lensJunior }}<image-slot id=\"gz-junior-v4\" src=\"b3bf4554-c649-42c0-89ba-337b38acf617\" shape=\"rect\" placeholder=\"Foto: admin junior, cara ingenua\" style=\"position:absolute;inset:0;filter:grayscale(1) contrast(1.15)\"><\u002Fimage-slot><\u002Fdiv>\n      <figcaption style=\"font:italic 400 11px/1.25 'Playfair Display',serif;color:#4a453a\">Fig. 3 — L. Lestrade, el nuevo administrador junior.<\u002Ffigcaption>\n    <\u002Ffigure>\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:4px\">\n      <div style=\"position:relative;height:120px;border:1px solid #17150f;overflow:hidden;background-color:#1f1d18;background-image:radial-gradient(oklch(0.62 0.2 210 / .55) 1px,transparent 1.4px);background-size:5px 5px;display:flex;align-items:flex-end;padding:5px\">{{ lensDesk }}<image-slot id=\"gz-ai-v4\" src=\"8c27de44-bb8d-498e-91a4-78f3c8dfe1a3\" shape=\"rect\" placeholder=\"Foto: monitor con reglas generadas por IA\" style=\"position:absolute;inset:0;filter:grayscale(1) contrast(1.15)\"><\u002Fimage-slot>{{ scanCya }}<\u002Fdiv>\n      <figcaption style=\"font:italic 400 11px/1.25 'Playfair Display',serif;color:#4a453a\">Fig. 4 — El escritorio del administrador: cientos de reglas creadas por IA.<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fdiv>\n  <blockquote style=\"margin:4px 0;padding:10px 0;border-top:1px solid #17150f;border-bottom:1px solid #17150f;font:900 22px/1.15 'Playfair Display',serif;text-align:center;text-wrap:balance\">«Él decía que todas las políticas estaban aplicando.»<span style=\"display:block;margin-top:6px;font:400 10px/1 'Courier Prime',monospace;letter-spacing:.1em;text-transform:uppercase\">— L. Lestrade, administrador junior<\u002Fspan><\u002Fblockquote>\n  <p style=\"margin:0;font:400 15px/1.45 'Courier Prime',monospace;text-wrap:pretty\">El banco ha convocado a los Ciber Sherlocks. Su herramienta: la misma consola que el administrador dejó abierta.<\u002Fp>\n  <button sc-camel-on-click=\"{{ backFromReport }}\" style=\"margin-top:8px;height:52px;border:2px solid #17150f;background:#17150f;color:#ece6d8;font:700 14px/1 'Courier Prime',monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;box-shadow:5px 5px 0 oklch(0.62 0.2 350)\" style-hover=\"box-shadow:2px 2px 0 oklch(0.62 0.2 350);transform:translate(3px,3px)\">{{ backCta }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSolved }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"min-height: 100%;animation:gz-page .75s cubic-bezier(.2,.7,.2,1) both,gz-shake .55s 1.05s;transform-origin:left center;background-color:#ece6d8;background-image:radial-gradient(rgba(23,21,15,.07) 1px,transparent 1.2px);background-size:5px 5px;color:#17150f;padding:56px 18px 30px;display:flex;flex-direction:column;gap:12px\">\n  <div style=\"display:flex;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid #17150f;font:400 10px/1 'Courier Prime',monospace;letter-spacing:.06em;text-transform:uppercase\"><span>Edición extra · {{ stampTime }}<\u002Fspan><span>Nº {{ cur.num }}/07<\u002Fspan><\u002Fdiv>\n  <div style=\"text-align:center;font:400 34px/1 'UnifrakturMaguntia',serif;padding-bottom:6px;border-bottom:3px double #17150f\">La Gaceta de Baker St.<\u002Fdiv>\n  <span style=\"text-align:center;font:900 76px/.85 'Playfair Display',serif;letter-spacing:-.02em;text-transform:uppercase;margin-top:8px\">¡Extra!<\u002Fspan>\n  <div style=\"position:relative;height:170 u002Fspan>\n    <div style=\"flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px\">\n      <sc-for list=\"{{ progress }}\" as=\"p\" hint-placeholder-count=\"7\"><div style=\"height:8px;border:1px solid #17150f;background:{{ p.bg }}\"><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:12px\">\n    <sc-if value=\"{{ hasNext }}\" hint-placeholder-val=\"{{ true }}\">\n      <button sc-camel-on-click=\"{{ goNext }}\" style=\"width:100%;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:2px solid #17150f;background:#17150f;color:#ece6d8;cursor:pointer;box-shadow:5px 5px 0 oklch(0.62 0.2 210)\" style-hover=\"box-shadow:2px 2px 0 oklch(0.62 0.2 210);transform:translate(3px,3px)\">\n        <span style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font:700 10px/1 'Courier Prime',monospace;letter-spacing:.16em;text-transform:uppercase;color:oklch(0.8 0.14 210)\">Nueva pista desclasificada<\u002Fspan>\n          <span style=\"font:900 22px/1 'Playfair Display',serif\">{{ nextNum }} · {{ nextTitle }}<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font:700 22px/1 'Courier Prime',monospace\">→<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ afterSolve }}\" style=\"width:100%;height:46px;border:1px solid #17150f;background:transparent;color:#17150f;font:700 12px/1 'Courier Prime',monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:#f6f1e6\">{{ afterLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isFinal }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"min-height: 100%;animation:gz-page .75s cubic-bezier(.2,.7,.2,1) both,gz-shake .55s 1.25s;transform-origin:left center;background-color:#ece6d8;background-image:radial-gradient(rgba(23,21,15,.07) 1px,transparent 1.2px);background-size:5px 5px;color:#17150f;padding:56px 18px 28px;display:flex;flex-direction:column;gap:11px\">\n  <div style=\"display:flex;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid #17150f;font:400 10px/1 'Courier Prime',monospace;letter-spacing:.06em;text-transform:uppercase\"><span>Vol. XXVI · Nº 221B<\u002Fspan><span>Edición de cierre<\u002Fspan><\u002Fdiv>\n  <div style=\"text-align:center;font:400 36px/1 'UnifrakturMaguntia',serif;padding-bottom:6px;border-bottom:3px double #17150f\">La Gaceta de Baker St.<\u002Fdiv>\n  <div style=\"position:relative\">\n    <h1 style=\"margin:4px 0 0;font:900 70px/.86 'Playfair Display',serif;letter-spacing:-.02em;text-transform:uppercase;text-shadow:2px 0 oklch(0.62 0.2 350 / .85),-2px 0 oklch(0.62 0.2 210 / .85)\">Caso cerrado<\u002Fh1>\n    <span style=\"position:absolute;right:0;bottom:-6px;transform:rotate(-9deg);border:3px solid oklch(0.58 0.22 350);color:oklch(0.58 0.22 350);padding:4px 8px;font:700 14px/1 'Courier Prime',monospace;letter-spacing:.12em;background:rgba(236,230,216,.8);animation:gz-stamp .45s .95s cubic-bezier(.3,1.4,.5,1) both\">{{ solvedPad }}/07<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid #17150f;border-bottom:1px solid #17150f\">\n    <div style=\"height:94px;border:1px solid #17150f;background-color:#d8d0bd;overflow:hidden\"><div style=\"width:100%;height:100%;background:center/cover no-repeat url({{ agentSrc }});filter:grayscale(1) contrast(1.15)\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:5px;justify-content:center\">\n      <span style=\"font:400 10px/1 'Courier Prime',monospace;letter-spacing:.08em;text-transform:uppercase\">Ficha {{ agentCode }} · {{ agentRole }}<\u002Fspan>\n      <span style=\"font:900 26px/1 'Playfair Display',serif\">{{ agentName }}<\u002Fspan>\n      <span style=\"font:italic 700 16px/1 'Playfair Display',serif;color:oklch(0.5 0.2 350)\">{{ rank }}<\u002Fspan>\n      <span style=\"font:400 12px/1 'Courier Prime',monospace\">Tiempo: {{ timeUsed }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px\">\n    <sc-for list=\"{{ board }}\" as=\"c\" hint-placeholder-count=\"7\">\n      <div style=\"display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;align-items:baseline;padding:6px 0;border-bottom:1px dotted #17150f\">\n        <span style=\"font:700 11px/1 'Courier Prime',monospace\">{{ c.num }}<\u002Fspan>\n        <span style=\"font:700 14px/1.15 'Playfair Display',serif\">{{ c.title }} <span style=\"font:400 9px/1 'Courier Prime',monospace;letter-spacing:.06em;text-transform:uppercase;color:#4a453a\">· {{ c.finalStatus }}<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <p style=\"margin:4px 0 0;font:italic 400 17px/1.3 'Playfair Display',serif;text-wrap:pretty\">“Elimina lo imposible: lo que quede, por improbable que parezca, es la verdad.”<\u002Fp>\n  <span style=\"font:400 13px/1.4 'Courier Prime',monospace;color:#3a362d\">Muestra esta edición en el stand y habla con un especialista de Cisco Secure Workload.<\u002Fspan>\n  <button sc-camel-on-click=\"{{ reset }}\" style=\"margin-top:auto;height:46px;border:1px solid #17150f;background:transparent;color:#17150f;font:700 12px/1 'Courier Prime',monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:#f6f1e6\">Nuevo equipo<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;pin&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Facilitador&quot;},&quot;minutes&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;min&quot;:5,&quot;max&quot;:60,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Juego&quot;},&quot;unlockAll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Juego&quot;}}\">\nconst CLUES = [\n  { title: 'El eslabón débil', ad: 'Se busca', hint: 'Todo sospechoso tiene una calificación. En el tablero principal, el Vulnerability Score más bajo señala al culpable.',\n    questions: [{ text: '¿Cuál(es) es la(s) carga(s) de trabajo (Workloads) más vulnerable(s)?', note: 'Vulnerability Score más bajo.' }] },\n  { title: 'El paquete culpable', ad: 'Se busca', hint: 'Ya tienes al sospechoso. Abre su maleta: lo que trae instalado lo delata.',\n    questions: [{ text: 'En la carga de trabajo (Workload) que encontraste en la pista anterior, ¿cuál es el nombre del paquete con el CVSS más alto?', note: 'CVSS más alto = paquete más riesgoso.' }] },\n  { title: 'Puertas abiertas', ad: 'Aviso', hint: 'Un buen ladrón no rompe muros: busca puertas sin usar. El Attack Surface Score más bajo te dirá dónde están.',\n    questions: [{ text: '¿Qué carga de trabajo (Workload) tiene más puertos abiertos sin usar que un atacante podría explotar (Attack Surface)?', note: 'Score más bajo = más riesgo.' }] },\n  { title: 'Huellas', ad: 'Testigos', hint: 'Empieza por el Forensics Score más bajo. Luego, los colores no son decoración: cuando una línea cambia de tono, alguien estuvo ahí.',\n    questions: [{ text: '¿Hay alguna carga de trabajo (Workload) con Score Forense bajo? ¿Qué usuarios estuvieron involucrados?', note: 'Score más bajo = más riesgo.' }] },\n  { title: 'El censo', ad: 'Registro', hint: 'Dos caminos, un mismo número. Uno lo ve todo con una mirada global; el otro pasa por la segmentación.',\n    questions: [{ text: '¿Cuántas aplicaciones hay en el inventario del DATACENTER INTERNO, dentro del ambiente de PRODUCCIÓN?', note: 'Hay dos formas de llegar: una más “global” que la otra. Revisa el menú principal.' }] },\n  { title: 'La escena del crimen', ad: 'Urgente', hint: 'Las reglas dicen “aplicando”. ¿Todas? Mira la segmentación como un mapa.',\n    context: 'Al parecer hubo un ataque dirigido a una aplicación financiera protegida con agentes. Encuéntrala en la sección de segmentación del menú principal.',\n    questions: [\n      { text: '¿Cuántas políticas tiene esta aplicación?' },\n      { text: 'Toma una foto de la representación gráfica de esta aplicación.', photo: true },\n      { text: 'El administrador dice que todas las reglas estaban aplicando (enforcement). ¿Hay alguna razón por la cual el ataque pudo producirse?' }] },\n  { title: 'La coartada', ad: 'Declaración', hint: 'Las banderas no mienten: marcan el día en que empezó cada prueba.',\n    context: 'El administrador cuenta que en enero de este año analizó una política nueva (Policy Analysis) sobre la aplicación financiera de Azure protegida sin agentes, para probar sus efectos sin afectar producción.',\n    questions: [\n      { text: '¿En qué fecha exacta fue este evento?', note: 'Los análisis se identifican con una bandera que marca desde cuándo empezaron.' },\n      { text: '¿Qué versión de la política era?' }] },\n];\nconst IMG = {\n  cover: 'https://cdn.gamma.app/vaapydyfza9nndv/design-anything/jBvzGZT32jVYodwYEOYfj/7iJd3ENaeLO9rq5fdzgbY.jpg',\n  irene: 'https://cdn.gamma.app/vaapydyfza9nndv/design-anything/TEWr04MHtcQye5WiiQQwr/8SxXNepFt5cH71WPnCuxd.jpg',\n  watson: 'https://cdn.gamma.app/vaapydyfza9nndv/design-anything/TQ8NuLjYP7eNy0pVcfK2u/_FGaiGEPxvnLk6w7RF3Qg.jpg',\n  hudson: 'https://cdn.gamma.app/vaapydyfza9nndv/design-anything/h5lUaOs5xEfNSC2oZOxW3/jiyzLObNVW21bsm2M9jAk.jpg',\n  crime: 'assets/escena-crimen.webp', junior: 'assets/admin-junior.webp', desk: 'assets/escritorio-ia.webp',\n  mycroft: 'https://cdn.gamma.app/vaapydyfza9nndv/design-anything/sVdRt6KSHWkzWObwtxsET/8A44rRJTklXoNoN3z4mYv.jpg',\n};\nconst PERSONAS = [\n  { name: 'Irene V.', role: 'Analista de vulnerabilidades', code: 'A-01', rot: '-2deg', slot: 'gz-p1', src: IMG.irene },\n  { name: 'J. Watson', role: 'Rastreador de tráfico', code: 'A-02', rot: '1.5deg', slot: 'gz-p2', src: IMG.watson },\n  { name: 'M. Hudson', role: 'Cronista forense', code: 'A-03', rot: '1deg', slot: 'gz-p3', src: IMG.hudson },\n  { name: 'Mycroft H.', role: 'Estratega de políticas', code: 'A-04', rot: '-1.5deg', slot: 'gz-p4', src: IMG.mycroft },\n];\nconst RANKS = ['Aprendiz', 'Aprendiz', 'Inspector', 'Inspector', 'Detective', 'Detective', 'Detective sénior', 'Detective consultor'];\nconst KEY = 'cs-gaceta-v3';\nconst MAG = 'oklch(0.58 0.22 350)', CYA = 'oklch(0.62 0.2 210)';\nconst pad = n => String(n).padStart(2, '0');\nconst fmt = s => { s = Math.max(0, Math.floor(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };\nconst h = React.createElement;\nconst Scan = (color) => h('div', { style: { position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden' } },\n  h('div', { style: { position: 'absolute', inset: 0, background: 'repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 3px)' } }),\n  h('div', { style: { position: 'absolute', left: 0, right: 0, height: '25%', background: `linear-gradient(180deg, transparent, ${color}, transparent)`, opacity: .45, animation: 'gz-scan 3.2s linear infinite' } }));\n\nfunction Magnifier({ src }) {\n  const [p, setP] = React.useState(null);\n  const ref = React.useRef(null);\n  const st = React.useRef({ active: false, timer: null, x0: 0, y0: 0, last: null });\n  const Z = 2.6, R = 64;\n  const calc = (cx, cy) => { const r = ref.current.getBoundingClientRect(); return { x: Math.max(0, Math.min(r.width, cx - r.left)), y: Math.max(0, Math.min(r.height, cy - r.top)), w: r.width, h: r.height }; };\n  const stop = () => { clearTimeout(st.current.timer); st.current.active = false; setP(null); };\n  React.useEffect(() => {\n    const el = ref.current;\n    const tm = e => { if (st.current.active) { e.preventDefault(); const t = e.touches[0]; setP(calc(t.clientX, t.clientY)); } };\n    el.addEventListener('touchmove', tm, { passive: false });\n    return () => el.removeEventListener('touchmove', tm);\n  }, []);\n  const down = e => {\n    if (e.pointerType === 'mouse') return;\n    const s = st.current; s.x0 = e.clientX; s.y0 = e.clientY; s.last = [e.clientX, e.clientY];\n    clearTimeout(s.timer);\n    s.timer = setTimeout(() => { s.active = true; setP(calc(s.last[0], s.last[1])); if (navigator.vibrate) navigator.vibrate(12); }, 260);\n  };\n  const move = e => {\n    const s = st.current;\n    if (e.pointerType === 'mouse') return setP(calc(e.clientX, e.clientY));\n    s.last = [e.clientX, e.clientY];\n    if (!s.active && Math.hypot(e.clientX - s.x0, e.clientY - s.y0) > 8) clearTimeout(s.timer);\n  };\n  return h('div', { ref, onPointerDown: down, onPointerMove: move, onPointerUp: e => e.pointerType !== 'mouse' && stop(), onPointerCancel: stop, onPointerLeave: e => e.pointerType === 'mouse' && setP(null), onContextMenu: e => e.preventDefault(),\n    style: { position: 'absolute', inset: 0, touchAction: 'pan-y', WebkitUserSelect: 'none', userSelect: 'none', WebkitTouchCallout: 'none', cursor: 'zoom-in', zIndex: 2 } },\n    !p && h('span', { style: { position: 'absolute', right: 8, top: 8, background: '#17150f', color: '#ece6d8', padding: '4px 7px', font: \"700 9px/1 'Courier Prime',monospace\", letterSpacing: '.14em', animation: 'gz-hint 1.6s ease-in-out infinite' } }, '◎ MANTÉN PULSADO'),\n    p && h('div', { style: { position: 'absolute', left: p.x - R, top: p.y - R, width: R * 2, height: R * 2, borderRadius: '50%', overflow: 'hidden', border: '3px solid #ece6d8', boxShadow: '0 0 0 2px #17150f, 0 0 26px oklch(0.75 0.15 210), 0 10px 24px rgba(0,0,0,.5)', animation: 'gz-lens .18s ease-out both', pointerEvents: 'none' } },\n      h('div', { style: { position: 'absolute', left: R - p.x, top: R - p.y, width: p.w, height: p.h, background: 'center/cover no-repeat url(' + src + ')', filter: 'grayscale(1) contrast(1.25)', transform: 'scale(' + Z + ')', transformOrigin: p.x + 'px ' + p.y + 'px' } }),\n      h('div', { style: { position: 'absolute', left: '50%', top: 18, bottom: 18, width: 1, background: 'oklch(0.75 0.18 350 / .7)' } }),\n      h('div', { style: { position: 'absolute', top: '50%', left: 18, right: 18, height: 1, background: 'oklch(0.75 0.18 350 / .7)' } }),\n      h('div', { style: { position: 'absolute', inset: 0, borderRadius: '50%', boxShadow: 'inset 0 0 18px rgba(0,0,0,.45)', background: 'radial-gradient(circle at 30% 25%, rgba(255,255,255,.25), transparent 40%)' } })));\n}\n\nclass Component extends DCLogic {\n  lensCover = h(Magnifier, { src: IMG.cover });\n  lensCrime = h(Magnifier, { src: IMG.crime });\n  lensJunior = h(Magnifier, { src: IMG.junior });\n  lensDesk = h(Magnifier, { src: IMG.desk });\n  state = (() => {\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}\n    return { screen: saved.screen || 'intro', idx: saved.idx || 0, solved: saved.solved || CLUES.map(() => null), persona: saved.persona ?? null,\n      notes: saved.notes || {}, startedAt: saved.startedAt || null, endedAt: saved.endedAt || null, pin: '', pinMsg: '', now: Date.now() };\n  })();\n  componentDidMount() { this.t = setInterval(() => this.setState({ now: Date.now() }), 1000); this.onR = () => this.forceUpdate(); window.addEventListener('resize', this.onR); }\n  componentWillUnmount() { clearInterval(this.t); window.removeEventListener('resize', this.onR); }\n  componentDidUpdate() {\n    if (this.state.justUnlocked != null && (this.state.screen === 'board' || this.state.screen === 'clue') && !this.rt) { this.rt = setTimeout(() => { this.rt = null; this.setState({ justUnlocked: null }); }, 1900); }\n    const { screen, idx, solved, notes, startedAt, endedAt, persona } = this.state;\n    try { localStorage.setItem(KEY, JSON.stringify({ screen: screen === 'pin' ? 'clue' : screen === 'report' ? (this.state.from || 'board') : screen, idx, solved, notes, startedAt, endedAt, persona })); } catch (e) {}\n  }\n  go = (screen, extra) => this.setState({ screen, pin: '', pinMsg: '', ...extra });\n  press = k => {\n    const code = String(this.props.pin ?? '2026').slice(0, 4);\n    if (k === 'C') return this.setState({ pin: '', pinMsg: '' });\n    if (k === '←') return this.setState(s => ({ pin: s.pin.slice(0, -1), pinMsg: '' }));\n    const pin = (this.state.pin + k).slice(0, 4);\n    if (pin.length < 4) return this.setState({ pin, pinMsg: '' });\n    if (pin === code) { const solved = this.state.solved.slice(); const i = this.state.idx; solved[i] = Date.now(); const ju = i + 1 < CLUES.length && !solved[i + 1] ? i + 1 : null; this.go('solved', { solved, justUnlocked: ju }); }\n    else this.setState({ pin: '', pinMsg: '> ACCESO DENEGADO' });\n  };\n  scanMag = Scan('oklch(0.75 0.18 350)');\n  scanCya = Scan('oklch(0.8 0.14 210)');\n  renderVals() {\n    const { screen, idx, solved, notes, startedAt, endedAt, now, pin, pinMsg, persona } = this.state;\n    const minutes = this.props.minutes ?? 30;\n    const unlockAll = this.props.unlockAll ?? false;\n    const elapsed = startedAt ? ((endedAt || now) - startedAt) / 1000 : 0;\n    const left = minutes * 60 - elapsed;\n    const solvedCount = solved.filter(Boolean).length;\n    const allSolved = solvedCount === CLUES.length;\n    const board = CLUES.map((c, i) => {\n      const isDone = !!solved[i];\n      const isLocked = !(unlockAll || i === 0 || !!solved[i - 1] || isDone);\n      const isActive = !isLocked && !isDone;\n      return { num: pad(i + 1), title: c.title, ad: c.ad, isDone, isActive, isLocked, isOpen: !isLocked,\n        bg: isActive ? '#f6f1e6' : 'transparent',\n        shadow: isActive ? `4px 4px 0 ${CYA}` : 'none',\n        stampRot: (i % 2 ? 7 : -8) + 'deg',\n        finalStatus: isDone ? 'Resuelto' : 'Pendiente', reveal: screen === 'board' && this.state.justUnlocked === i,\n        open: () => !isLocked && this.go('clue', { idx: i }) };\n    });\n    const c = CLUES[idx];\n    const cur = { num: pad(idx + 1), title: c.title, ad: c.ad, hint: c.hint, context: c.context || '',\n      questions: c.questions.map((q, j) => ({ ...q, mark: c.questions.length > 1 ? String.fromCharCode(97 + j) + ')' : '—', note: q.note || '', photo: !!q.photo })) };\n    const next = solved.findIndex((x, i) => !x && i > idx);\n    const nextAny = next >= 0 ? next : solved.findIndex(x => !x);\n    const P = PERSONAS[persona ?? 0];\n    const full = this.props.frame === false || (typeof window !== 'undefined' && window.innerWidth < 600);\n    return {\n      outerPad: full ? '0' : '40px 20px', shellW: full ? '100vw' : '402px', shellH: full ? '100dvh' : '874px',\n      shellR: full ? '0' : '44px', shellShadow: full ? 'none' : '0 0 0 10px #0d0c0a, 0 40px 80px rgba(0,0,0,.5)',\n      isIntro: screen === 'intro', isAgent: screen === 'agent', isBoard: screen === 'board', isClue: screen === 'clue', isPin: screen === 'pin', isSolved: screen === 'solved', isFinal: screen === 'final',\n      scan: this.scanMag, scanCya: this.scanCya,\n      minutes, timeLeft: fmt(left), timerColor: left < 300 ? MAG : '#17150f', timerColorInv: left < 300 ? 'oklch(0.75 0.18 350)' : '#ece6d8',\n      timeUsed: fmt(elapsed), solvedCount, solvedPad: pad(solvedCount), allSolved, board, cur,\n      rank: RANKS[solvedCount], img: IMG, agentSrc: P.src, officeSrc: IMG.crime, agentName: P.name, agentRole: P.role, agentCode: P.code,\n      personas: PERSONAS.map((p, i) => ({ ...p, selected: persona === i, shadow: persona === i ? `5px 5px 0 ${MAG}` : '2px 2px 0 rgba(23,21,15,.25)', pick: () => this.setState({ persona: i }) })),\n      noPersona: persona == null,\n      progress: solved.map((x, i) => ({ bg: x ? '#17150f' : i === idx && screen !== 'board' ? MAG : 'transparent' })),\n      note: notes[idx] || '', onNote: e => { const v = e.target.value; this.setState(s => ({ notes: { ...s.notes, [idx]: v } })); },\n      pinDots: [0, 1, 2, 3].map(i => ({ ch: i < pin.length ? '■' : '_' })), pinMsg,\n      keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '←'].map(k => ({ label: k, press: () => this.press(k) })),\n      stampTime: solved[idx] ? new Date(solved[idx]).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }) : '',\n      hasNext: !allSolved && nextAny >= 0, nextNum: pad(nextAny + 1), nextTitle: nextAny >= 0 ? CLUES[nextAny].title : '',\n      goNext: () => nextAny >= 0 && this.go('clue', { idx: nextAny }),\n      afterLabel: allSolved ? 'Cerrar expediente' : 'Volver al tablón',\n      afterSolve: () => allSolved ? this.go('final', { endedAt: Date.now() }) : this.go('board'),\n      isReport: screen === 'report', revealClue: screen === 'clue' && this.state.justUnlocked === idx, lensCover: this.lensCover, lensCrime: this.lensCrime, lensJunior: this.lensJunior, lensDesk: this.lensDesk,\n      goReport: () => this.go('report', { from: screen === 'intro' ? 'intro' : 'board' }),\n      backFromReport: () => this.go(this.state.from || 'board'),\n      backLabel: this.state.from === 'intro' ? 'Portada' : 'Tablón',\n      backCta: this.state.from === 'intro' ? 'Volver a la portada' : 'Volver al tablón →',\n      start: () => this.go(this.state.persona != null && this.state.startedAt ? 'board' : 'agent'),\n      goHome: () => this.go('intro'),\n      enter: () => persona != null && this.go('board', { startedAt: startedAt || Date.now() }),\n      goBoard: () => this.go('board'), goClue: () => this.go('clue'), goPin: () => this.go('pin'),\n      goFinal: () => this.go('final', { endedAt: endedAt || Date.now() }),\n      reset: () => this.go('intro', { idx: 0, solved: CLUES.map(() => null), notes: {}, startedAt: null, endedAt: null, persona: null }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
